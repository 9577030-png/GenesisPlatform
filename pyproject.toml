[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps"]
markers = [
    "integration: integration tests",
    "external: requires optional external/infrastructure dependencies",
]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^template/", "^apps/"]
