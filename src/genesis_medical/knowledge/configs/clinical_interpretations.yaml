      note: Гинекологический осмотр, обследование ЖКТ при отсутствии менструальных кровопотерь.
    - step: Контроль
      note: Повтор ферритина через 3 месяца терапии.
    references:
    - WHO guideline on iron deficiency (2023)
  ferritin_high_male:
    id: ferritin_high_male
    label: Повышенный ферритин (мужчины)
    category: Гематология
    description: Ферритин ≥ 400 мкг/Л у мужчин – маркер перегрузки железом или воспаления.
    criteria:
    - parameter: ferritin
      threshold: 400
      unit: мкг/Л
      condition: '>='
      comment_template: Ферритин {value} мкг/Л превышает норму для мужчин (≥ 400).
    differentials:
    - condition: transferrin_saturation > 45%
      text: Гемохроматоз – генетическое заболевание с перегрузкой железом. Проверить HFE-мутации.
    - condition: crp > 5 OR esr > 15
      text: Воспаление (инфекция, аутоиммунное заболевание, злокачественное новообразование).
    - condition: alt > 45 OR ast > 40
      text: Повреждение печени (гепатит, НАЖБП, алкогольная болезнь).
    red_flags:
    - condition: ferritin > 1000 AND transferrin_saturation > 50%
      text: Выраженная перегрузка железом – риск цирроза, диабета, кардиомиопатии. Срочная консультация
        гематолога.
    treatment_hints:
    - step: Диагностика причины
      note: Насыщение трансферрина, CRP, печеночные пробы, HFE-генотипирование.
    - step: При гемохроматозе
      note: Флеботомия (кровопускание) для снижения ферритина.
    - step: При воспалении
      note: Лечение основного заболевания.
    references:
    - EASL Clinical Practice Guidelines on haemochromatosis (2022)
