    criteria:
    - parameter: ferritin
      threshold: 15
      unit: мкг/Л
      condition: <
      comment_template: Ферритин {value} мкг/Л ниже нормы для женщин (< 15).
    differentials:
    - condition: hemoglobin < 120 AND menstruation_heavy == true
      text: Железодефицитная анемия на фоне меноррагий.
    - condition: serum_iron < 9
      text: Снижение сывороточного железа подтверждает дефицит.
    red_flags:
    - condition: ferritin < 10 AND hemoglobin < 100
      text: Критический дефицит железа – требуется немедленная коррекция, возможно парентерально.
