name: Genesis Release

on:
  push:
    tags:
      - "genesis-core-v*"
      - "genesis-medical-v*"
      - "genesis-construction-v*"
      - "genesis-banking-v*"

permissions:
  contents: read

jobs:
  publish-core:
    if: startsWith(github.ref_name, 'genesis-core-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check PyPI token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "PYPI_API_TOKEN is not configured"
            exit 1
          fi

      - name: Build core
        run: |
          python -m pip install --upgrade pip build twine
          python -m build ./packages/genesis-core --outdir dist/genesis-core

      - name: Publish core to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/genesis-core/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Genesis Core ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/genesis-core/*


