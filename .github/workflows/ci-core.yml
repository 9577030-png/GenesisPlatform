name: Genesis Core CI

on:
  push:
    paths:
      - "src/genesis_core/**"
      - "packages/genesis-core/**"
      - "tests/unit/genesis_core/**"
      - "tests/integration/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci-core.yml"
  pull_request:
    paths:
      - "src/genesis_core/**"
      - "packages/genesis-core/**"
      - "tests/unit/genesis_core/**"
      - "tests/integration/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci-core.yml"

jobs:
  all-domains:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./packages/genesis-core
          python -m pip install -e ./packages/genesis-medical
          python -m pip install -e ./packages/genesis-construction
          python -m pip install -e ./packages/genesis-banking
      - name: Test all domains
        run: pytest -q
      - name: Verify installed entry points
        run: python scripts/verify_entry_points.py
      - name: Check Core API version bump
        if: ${{ github.event_name == 'pull_request' }}
        run: python scripts/check_version_bump.py --base "${{ github.event.pull_request.base.sha }}" --package genesis-core --api-path src/genesis_core/api.py
