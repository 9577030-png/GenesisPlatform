name: Genesis Construction CI

on:
  push:
    paths:
      - "src/genesis_construction/**"
      - "packages/genesis-construction/**"
      - "tests/unit/genesis_construction/**"
      - ".github/workflows/ci-construction.yml"
  pull_request:
    paths:
      - "src/genesis_construction/**"
      - "packages/genesis-construction/**"
      - "tests/unit/genesis_construction/**"
      - ".github/workflows/ci-construction.yml"

jobs:
  construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Core and Construction
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./packages/genesis-core
          python -m pip install -e ./packages/genesis-construction
      - name: Test Construction
        run: pytest -q tests/unit/genesis_construction
      - name: Verify Construction domain descriptor
        run: python -c "from genesis_construction import get_domain_descriptor; d=get_domain_descriptor(); assert d.name == 'construction'; d.get_rule_loader()"
      - name: Build Construction wheel
        run: python -m build ./packages/genesis-construction --outdir dist/genesis-construction
