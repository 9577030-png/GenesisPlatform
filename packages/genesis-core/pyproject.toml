[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-core"
version = "0.3.0"
readme = "README.md"
description = "Universal rule engine for the Genesis platform"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["genesis_core*"]

[tool.setuptools.package-data]
"genesis_core" = ["py.typed"]
