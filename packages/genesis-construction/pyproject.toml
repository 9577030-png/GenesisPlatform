[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-construction"
version = "0.2.0"
readme = "README.md"
description = "Construction domain module for the Genesis platform"
requires-python = ">=3.11"
dependencies = ["genesis-core>=0.3,<0.4", "PyYAML>=6.0"]

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["genesis_construction*"]

[tool.setuptools.package-data]
"genesis_construction" = ["knowledge/**/*.yaml"]

[project.entry-points."genesis.domains"]
construction = "genesis_construction:get_domain_descriptor"
